<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fateh Mammari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#212121);--ink:light-dark(#0d0d0d,#ececec);--mute:light-dark(#5d5d5d,#b4b4b4);--line:light-dark(#e5e5e5,#3a3a3a);--side:light-dark(#f9f9f9,#171717);--c2:light-dark(#4c6ef5,#8ea8ff);--c3:light-dark(#c2255c,#f783ac)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Inter",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:56px 20px}
h1{font-size:26px;font-weight:600;margin:0 0 4px}
.sub{margin:0 0 32px;color:var(--mute)}
a.card{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;transition:background .15s}
a.card:hover{background:var(--side)}
.logo{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;display:grid;place-items:center;font-family:"Times New Roman",serif;font-size:19px}
a.card strong{display:block;font-weight:600}
a.card span.d{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Fateh Mammari</h1>
<p class="sub">Cours et exercices corrigés</p>
<a class="card" href="analyse/"><span class="logo">∑</span><span><strong>Analyse mathématique</strong><span class="d">Séries numériques, séries entières, séries de Fourier et transformée de Fourier</span></span></a>
</main>
</body>
</html>
